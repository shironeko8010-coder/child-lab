# GitHub Pages へ公開する設定。アプリに必要なファイルだけを公開し、tests/ docs/ tools/ は公開しない。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルだけを集める
        run: |
          mkdir _site
          cp -r index.html top.js manifest.json sw.js icons app-chiiku app-benkyo shared _site/
          mkdir -p _site/voice && cp -r voice/z _site/voice/
          touch _site/.nojekyll
      # 2026-11-20 から、古い版（v3／v4）の組み合わせでは公開に失敗するようになったため、新しい版（v5）にした
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
