# GitHub Pages へ公開する設定。アプリに必要なファイルだけを公開し、tests/ docs/ tools/ は公開しない。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 2026-11-20 から、集める・アップロード・公開を 1つの仕事でまとめて行うと「ファイルが見つからない」で失敗するようになった。
# そのため GitHub のお手本どおり、「集めてアップロードする仕事（build）」と「公開する仕事（deploy）」に分けた。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルだけを集める
        run: |
          mkdir _site
          cp -r index.html top.js manifest.json sw.js icons app-chiiku app-benkyo shared _site/
          mkdir -p _site/voice && cp -r voice/z _site/voice/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
