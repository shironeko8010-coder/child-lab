<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>がくしゅう</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/ui.css">
<style>
  /* ===== トップ画面（どれで あそぶ？）：汽車が2台 走ってくる =====
     大きさは 画面（.scene）を基準にした cq 単位で決める。スクロールは出さない。 */
  html, body { height: 100%; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; }
  .scene { position: fixed; top: var(--safe-t, 0px); right: var(--safe-r, 0px); bottom: var(--safe-b, 0px); left: var(--safe-l, 0px); overflow: hidden; container-type: size;
    background: linear-gradient(#a8dcf7 0%, #d8f0fb 60%, #fff6d8 100%); }
  .title { position: absolute; left: 0; right: 0; top: 4cqh; margin: 0; text-align: center; z-index: 5; white-space: nowrap;
    font-size: clamp(24px, 9cqmin, 60px); font-weight: 900; color: var(--c-primary-dark, #e06f20); letter-spacing: .04em; }
  .title span { display: inline-block; text-shadow: 0 3px 0 #fff, 0 -2px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff; }
  .started .title span { animation: t-hop 2.4s ease-in-out infinite; }
  .title span:nth-child(2) { animation-delay: .12s; } .title span:nth-child(3) { animation-delay: .24s; }
  .title span:nth-child(5) { animation-delay: .48s; } .title span:nth-child(6) { animation-delay: .6s; }
  .title span:nth-child(7) { animation-delay: .72s; } .title span:nth-child(8) { animation-delay: .84s; }
  @keyframes t-hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-14%); } }

  .mt { position: absolute; left: 0; right: 0; bottom: 20cqh; width: 100%; height: 34cqh; z-index: 1; }
  .cloud { position: absolute; width: 20cqmin; height: 11cqmin; z-index: 1; animation: drift linear infinite; }
  .cloud svg { display: block; width: 100%; height: 100%; }
  .c1 { top: 7cqh; animation-duration: 50s; animation-delay: -20s; }
  .c2 { top: 16cqh; width: 15cqmin; animation-duration: 70s; animation-delay: -50s; }
  @keyframes drift { from { left: 110cqw; } to { left: -35cqw; } }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 22cqh; background: #8fd16b; z-index: 1; }

  .rows { position: absolute; left: 0; right: 0; top: 18cqh; bottom: 4cqh; display: flex; z-index: 4; }
  .row { flex: 1 1 0; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5cqmin; }
  .rail { position: absolute; left: 0; right: 0; bottom: 2cqmin; height: 3.2cqmin;
    background: linear-gradient(#7b6a5c, #7b6a5c) top / 100% 26% no-repeat, linear-gradient(#7b6a5c, #7b6a5c) bottom / 100% 26% no-repeat,
      repeating-linear-gradient(90deg, #a0846a 0 1.4cqmin, transparent 1.4cqmin 4.4cqmin); }
  .train { position: relative; display: flex; align-items: flex-end; height: min(54cqh, 24cqw); transform: translateX(120cqw); }
  .started .train { animation: arrive 2.2s cubic-bezier(.2, .75, .3, 1) forwards; }
  .started .row:nth-child(2) .train { animation-delay: .25s; }
  .row.go .train { animation: depart 1.1s cubic-bezier(.6, 0, .9, .6) forwards; }
  @keyframes arrive { from { transform: translateX(120cqw); } to { transform: translateX(0); } }
  @keyframes depart { from { transform: translateX(0); } to { transform: translateX(-130cqw); } }

  .eng { height: 78%; aspect-ratio: .95; position: relative; }
  .eng > svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .car { height: 100%; aspect-ratio: 1.18; margin-left: 1.2cqmin; border-radius: 4cqmin 4cqmin 2cqmin 2cqmin; background: var(--body); position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8cqmin; padding: 2.4cqmin 2cqmin 5.4cqmin;
    box-shadow: inset 0 -2.2cqmin 0 rgba(0, 0, 0, .14); text-decoration: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .car::before { content: ""; position: absolute; left: -1.2cqmin; bottom: 4.4cqmin; width: 1.4cqmin; height: 1.4cqmin; background: #555; }
  .car:active { filter: brightness(1.06); }
  .k1 { --body: #ff8a5b; } .k2 { --body: #5aa2ea; }
  .win { flex: 1 1 auto; min-height: 0; aspect-ratio: 1.25; background: #fffaf0; border-radius: 3cqmin; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; border: .9cqmin solid rgba(0, 0, 0, .12); }
  .win svg { display: block; height: 92%; width: auto; aspect-ratio: 1; overflow: visible; }
  .plate { background: #fff; border-radius: 999px; padding: .3cqmin 3cqmin; }
  .lbl { font-size: clamp(20px, 6.6cqmin, 44px); font-weight: 900; color: #3a3a3a; white-space: nowrap; line-height: 1.15; }
  .wheel { position: absolute; bottom: -2.2cqmin; width: 6.4cqmin; height: 6.4cqmin; border-radius: 50%; background: radial-gradient(#ddd 22%, #444 24% 34%, #666 36%); border: .8cqmin solid #333; }
  .wheel::after { content: ""; position: absolute; left: 45%; top: 0; width: 10%; height: 100%; background: #333; }
  .started .wheel { animation: roll .5s linear 4; }
  .started .row:nth-child(2) .wheel { animation-delay: .25s; }
  .row.go .wheel { animation: roll .35s linear infinite; }
  @keyframes roll { to { transform: rotate(-360deg); } }
  .smoke { position: absolute; left: 18%; top: -4%; width: 0; height: 0; }
  .smoke i { position: absolute; width: 6cqmin; height: 6cqmin; border-radius: 50%; background: rgba(255, 255, 255, .95); animation: puff 2.4s ease-out infinite; opacity: 0; }
  .smoke i:nth-child(2) { animation-delay: .8s; } .smoke i:nth-child(3) { animation-delay: 1.6s; }
  @keyframes puff { 0% { transform: translate(-50%, 0) scale(.4); opacity: .9; } 100% { transform: translate(30%, -260%) scale(1.6); opacity: 0; } }
  .eyes { animation: blink 4s infinite; transform-origin: center 45%; transform-box: fill-box; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .row.go .car { animation: bounce .4s ease 2; }
  @keyframes bounce { 30% { transform: translateY(-6%); } 60% { transform: translateY(1%); } }

  /* はじめの「タッチしてね」（スクリプトが動くときだけ出す） */
  .start { display: none; }
  .js .start { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqmin;
    background: rgba(255, 248, 231, .55); cursor: pointer; transition: opacity .45s; }
  .started .start { opacity: 0; pointer-events: none; }
  .js .scene:not(.started) .train { visibility: hidden; }
  .s-chick { width: clamp(90px, 34cqmin, 240px); height: clamp(90px, 34cqmin, 240px); animation: s-bob 1.1s ease-in-out infinite; }
  .s-chick svg { display: block; width: 100%; height: 100%; }
  @keyframes s-bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8%) rotate(4deg); } }
  .s-say { background: #fff; border-radius: 999px; padding: 1.6cqmin 5cqmin; font-size: clamp(24px, 8cqmin, 52px); font-weight: 900; color: var(--c-primary-dark, #e06f20); box-shadow: 0 4px 0 #ecd3b4; animation: s-pulse 1.1s ease-in-out infinite; }
  @keyframes s-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  html:not(.js) .train { transform: none; }   /* スクリプトが動かないときも、汽車（リンク）は 見えるように */

  /* たて向き：線路を2本にして、汽車を上下に */
  @container (orientation: portrait) {
    .rows { flex-direction: column; top: 14cqh; bottom: 3cqh; }
    .train { height: min(34cqh, 46cqw); }
    .mt { bottom: auto; top: 34cqh; height: 26cqh; }
    .ground { height: auto; top: 58cqh; }
    .row:first-child { background: linear-gradient(transparent 70%, #8fd16b 70%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .smoke i, .eyes, .s-chick, .s-say, .started .title span { animation: none; }
  }
</style>
</head>
<body>

  <div class="cloud c1"><svg viewBox="0 0 100 55" aria-hidden="true"><path d="M18 50 Q0 50 4 36 Q6 24 20 26 Q22 8 42 10 Q56 0 68 14 Q86 10 88 28 Q100 32 96 44 Q94 50 82 50 Z" fill="#fff"/></svg></div>
  <div class="cloud c2"><svg viewBox="0 0 100 55" aria-hidden="true"><path d="M18 50 Q0 50 4 36 Q6 24 20 26 Q22 8 42 10 Q56 0 68 14 Q86 10 88 28 Q100 32 96 44 Q94 50 82 50 Z" fill="#fff"/></svg></div>

    <div class="row">
      <div class="rail"></div>
      <div class="train">
        <div class="eng"><div class="smoke"><i></i><i></i><i></i></div>
          <svg viewBox="0 0 100 105" aria-hidden="true"><rect x="10" y="10" width="20" height="36" rx="4" fill="#555"/><rect x="4" y="4" width="32" height="10" rx="4" fill="#444"/><rect x="4" y="40" width="64" height="52" rx="10" fill="#3d7bd0"/><rect x="50" y="18" width="46" height="74" rx="10" fill="#3d7bd0"/><rect x="58" y="28" width="30" height="24" rx="6" fill="#fffaf0"/><rect x="0" y="86" width="100" height="10" rx="4" fill="rgba(0,0,0,.18)"/><circle cx="8" cy="66" r="7" fill="#ffd23f"/></svg>
          <i class="wheel" style="left:12%"></i><i class="wheel" style="left:58%"></i></div>

          <span class="win"><svg viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="112" rx="32" ry="5" fill="rgba(0,0,0,.08)"/><rect x="26" y="14" width="70" height="92" rx="10" fill="#fff" stroke="#d8e2ec" stroke-width="3"/><rect x="20" y="10" width="72" height="94" rx="10" fill="#5b9be0"/><rect x="20" y="10" width="14" height="94" rx="7" fill="#3f7fc8"/><rect x="44" y="20" width="38" height="10" rx="5" fill="#fff" opacity=".85"/><g class="eyes"><circle cx="50" cy="58" r="6.5" fill="#3a3a3a"/><circle cx="76" cy="58" r="6.5" fill="#3a3a3a"/><circle cx="52" cy="56" r="2" fill="#fff"/><circle cx="78" cy="56" r="2" fill="#fff"/></g><ellipse cx="42" cy="72" rx="6" ry="4" fill="#ff9fb0"/><ellipse cx="85" cy="72" rx="6" ry="4" fill="#ff9fb0"/><path d="M55 72 Q63 81 71 72" fill="none" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/><path d="M20 70 Q8 62 12 50" fill="none" stroke="#3f7fc8" stroke-width="6" stroke-linecap="round"/><path d="M92 70 Q106 60 104 48" fill="none" stroke="#3f7fc8" stroke-width="6" stroke-linecap="round"/></svg></span>

      </div>
    </div>
  </div>

  <div class="start" data-start>
    <div class="s-chick"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M24 44 Q14 30 30 34" fill="#ffc93d"/><path d="M96 44 Q106 30 90 34" fill="#ffc93d"/><ellipse cx="60" cy="62" rx="44" ry="46" fill="#ffd84d"/><ellipse cx="60" cy="76" rx="28" ry="25" fill="#fff0b3"/><path d="M54 16 Q60 4 66 16" fill="none" stroke="#ffc93d" stroke-width="5" stroke-linecap="round"/><g class="eyes"><circle cx="44" cy="52" r="6.5" fill="#3a3a3a"/><circle cx="76" cy="52" r="6.5" fill="#3a3a3a"/><circle cx="46" cy="50" r="2" fill="#fff"/><circle cx="78" cy="50" r="2" fill="#fff"/></g><ellipse cx="31" cy="66" rx="7" ry="4.5" fill="#ff9fb0"/><ellipse cx="89" cy="66" rx="7" ry="4.5" fill="#ff9fb0"/><path d="M52 63 L68 63 L60 73 Z" fill="#ff8a3d"/></svg></div>
    <div class="s-say">タッチしてね</div>
  </div>
</div>
