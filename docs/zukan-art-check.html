<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ずかんの絵の確認</title>
<style>body{margin:16px;font-family:system-ui,sans-serif;background:#f4f6fa}.g{display:flex;flex-wrap:wrap;gap:12px}.c{background:#fff;border-radius:12px;padding:8px;text-align:center;width:150px}.c svg{width:130px;height:130px}</style>
</head><body>
<h1 style="font-size:20px">ずかんの絵（11まい）の確認用</h1>
<div class="g" id="g"></div>
<script src="../app-benkyo/subjects/zukan-data.js"></script>
<script src="../app-benkyo/zukan-art.js"></script>
<script>
  var g = document.getElementById('g');
  Chiid.zukanData.PAGES.filter(function (p) { return p.art; }).forEach(function (p) {
    var d = document.createElement('div'); d.className = 'c';
    d.innerHTML = Chiid.zukanArt[p.art] + '<div>' + p.name + '</div>';
    g.appendChild(d);
  });
</script>
</body></html>
